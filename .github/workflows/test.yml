name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production-like container
        run: docker compose build dev
      - name: Run tests and compile check
        run: docker compose run --rm --no-deps dev sh -c 'carton exec prove -lv t && carton exec perl -c Run.pm'
