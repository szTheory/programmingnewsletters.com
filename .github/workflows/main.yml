name: Trigger Netlify Build
on:
  workflow_dispatch:
  schedule:
    # At 15:15
    - cron: '15 15 * * *'
jobs:
  build:
    name: Request Netlify Webhook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: netlify-production-build
      cancel-in-progress: false
    steps:
      - name: Curl request
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl --fail --show-error --silent --request POST --data '{}' "$NETLIFY_BUILD_HOOK_URL"
