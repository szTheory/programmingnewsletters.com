[build]
  publish = "public"
  command = "export PERL5LIB=/opt/buildhome/perl5/lib/perl5 && export PATH=/opt/buildhome/perl5/bin:$PATH && perl bin/cpanm App::cpanminus && cpanm Carton && carton install --deployment && carton exec perl Run.pm"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
